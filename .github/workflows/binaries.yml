name: Build release binaries
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
            binary: target/release/txnstage
          - os: macos-latest
            label: macos-arm64
            binary: target/release/txnstage
          - os: macos-15-intel
            label: macos-x86_64
            binary: target/release/txnstage
          - os: windows-latest
            label: windows-x86_64
            binary: target/release/txnstage.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend check
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Check preinstalled Chrome on Linux
        if: runner.os == 'Linux'
        run: google-chrome --version
      - name: Install Chromium on macOS and Windows
        if: runner.os != 'Linux'
        run: pnpm --dir frontend exec playwright install chromium
      - run: pnpm --dir frontend e2e
        env:
          PLAYWRIGHT_CHROME: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: python scripts/package-release.py '${{ matrix.binary }}' '${{ matrix.label }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: txnstage-${{ matrix.label }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-reports-${{ matrix.label }}
          path: |
            .cache/reports/
            frontend/playwright-report/
            frontend/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
