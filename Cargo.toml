[package]
name = "txnstage"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "A local visual laboratory for SQLite transactions, concurrency and data preservation"
repository = "https://github.com/0then0/txnstage"
readme = "README.md"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"

[profile.release]
lto = "thin"
strip = true
